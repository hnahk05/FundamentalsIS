[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "trencher"
version = "0.1.0"
description = "Trencher Predictive Modeling — TinyMLOps pipeline for subsea cable trencher load-peak prediction"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = [
    "pandas>=2.0",
    "numpy>=1.24",
    "scikit-learn>=1.3",
    "matplotlib>=3.7",
    "seaborn>=0.12",
    "requests>=2.31",
    "sqlalchemy>=2.0",
    "psycopg2-binary>=2.9",
    "tqdm>=4.65",
    "pyyaml>=6.0",
]

[project.scripts]
trencher-import = "trencher.scripts.run_import:main"
trencher-pipeline = "trencher.scripts.run_pipeline:main"
trencher-analysis = "trencher.scripts.run_analysis:main"

[tool.setuptools.packages.find]
where = ["src"]
